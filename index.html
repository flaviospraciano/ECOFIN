<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>

<title>ECOFIN · Economia e Finanças</title>
<meta name="description" content="Aplicativo para alunos de Economia e Finanças: trilha de primeiros passos, calendário, grade curricular, estudo e carreira.">

<script>try{var t=localStorage.getItem("ecofin_theme")||"auto";if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t==="dark"?"dark":"light";}catch(e){}</script>
<style>
:root{--bg:#F2F6FC;--sf:#fff;--sf2:#E9F0FA;--sf3:#DCE7F6;--line:#D9E4F2;--ink:#0F2347;--soft:#4F6488;--faint:#8A9DBD;--pri:#0E3A7C;--pri2:#1E56B3;--btn:#0E3A7C;--btntx:#fff;--grn:#2E8B3D;--grn2:#44B558;--grnbg:#E1F4E6;--red:#D6455D;--redbg:#FDE8EC;--amb:#D98A12;--ambbg:#FFF2D9;--blu:#2F7BE8;--blubg:#E3EDFD;--sh:0 1px 3px rgba(14,58,124,.08);--r:14px;color-scheme:light}
:root[data-theme=dark]{--bg:#0A1424;--sf:#10203A;--sf2:#16294A;--sf3:#1E355E;--line:#243B63;--ink:#EAF1FF;--soft:#A3B7DA;--faint:#6F86AC;--pri:#7DB1FF;--pri2:#9CC4FF;--btn:#4F93F4;--btntx:#06142B;--grn:#4CCB68;--grn2:#6EDC86;--grnbg:#12301E;--red:#FF7D91;--redbg:#3A1A24;--amb:#F2B14A;--ambbg:#3A2E14;--blu:#6AA5FF;--blubg:#14284A;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--pri2)}
.hidden{display:none!important}
.app{max-width:760px;margin:0 auto;padding:0 14px 24px}
.app.wide{max-width:1100px}
@media (min-width:900px){.app{max-width:900px}.app.wide{max-width:min(1500px,calc(100vw - 32px))}}
.lu{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none;display:inline-block}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;margin:0 -14px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.05rem;margin:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .logo{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:cover;border:1px solid var(--line)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--line);color:var(--ink);flex:none;position:relative}
.ib .lu{width:20px;height:20px}
.dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--sf)}
.lbl{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:20px 2px 8px;display:flex;align-items:center;gap:6px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.muted{color:var(--soft)}.small{font-size:.9rem}.tiny{font-size:.78rem}.faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btntx);font-weight:700;border-radius:12px;padding:11px 16px;text-decoration:none}
.btn.ghost{background:var(--sf);color:var(--ink);border:1px solid var(--line)}
.btn.grn{background:var(--grn);color:#fff}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{padding:7px 11px;font-size:.88rem;border-radius:10px}
.btn.full{width:100%}.btn:disabled{opacity:.5}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.link{color:var(--pri2);font-weight:700;padding:6px 0}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(14,58,124,.35);z-index:15}
:root[data-theme=dark] .fab{background:linear-gradient(135deg,#6AA5FF,#3E7FE0);color:#06142B}
.fab .lu{width:26px;height:26px;stroke-width:2.4}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:999px;background:var(--sf);border:1px solid var(--line);font-weight:700;font-size:.9rem;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--btntx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:800;background:var(--sf2);color:var(--soft)}
.st.g{background:var(--grnbg);color:var(--grn)}.st.r{background:var(--redbg);color:var(--red)}.st.o{background:var(--ambbg);color:var(--amb)}.st.b{background:var(--blubg);color:var(--blu)}
.fld{display:block;margin:10px 0}.fld>span{display:block;font-size:.78rem;font-weight:800;color:var(--soft);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri2) 25%,transparent)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--grn);padding:0}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.item .e{color:var(--pri2);flex:none}.item .e .lu{width:24px;height:24px}
.item b{display:block}.chev{color:var(--faint)}
.empty{text-align:center;color:var(--faint);padding:22px 8px}
.bar{height:9px;border-radius:99px;background:var(--sf3);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grn),var(--grn2));transition:width .4s}
.bar.b i{background:linear-gradient(90deg,var(--pri2),var(--blu))}
.hero{background:linear-gradient(135deg,var(--pri),#1A5A9E 60%,#2A8B4B);color:#fff;border-radius:20px;padding:18px;margin-top:14px}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#17386B,#1C5C8F 60%,#1F7A44)}
.hero h2{margin:0 0 4px;font-size:1.3rem}.hero p{margin:0;opacity:.9}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px 8px;min-height:96px;font-weight:700;font-size:.88rem;box-shadow:var(--sh)}
.tile .lu{width:30px;height:30px;stroke-width:1.7;color:var(--tc,var(--pri2))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--sf) 96%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:900px;margin:0 auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--faint);font-size:.72rem;font-weight:700;position:relative}
.nav button .lu{width:26px;height:26px;stroke-width:1.9}
.nav button[aria-current=true]{color:var(--pri2)}
.nav button[aria-current=true]::after{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--grn)}
.bd{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,20,45,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--sf3);margin:4px auto 12px}
.sheet h2{margin:4px 0 8px;font-size:1.2rem}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:22px}}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--line);color:var(--ink);padding:11px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:min(92vw,460px)}
.toast .lu{width:22px;height:22px;color:var(--pri2)}.toast span{display:block;font-size:.84rem;color:var(--soft)}
.netbar{position:fixed;left:0;right:0;top:0;z-index:95;padding:calc(5px + env(safe-area-inset-top,0px)) 12px 5px;font-size:.76rem;font-weight:700;text-align:center;color:#fff;display:flex;gap:6px;align-items:center;justify-content:center}
.netbar.off{background:#C2410C}.netbar.sync{background:#1D4ED8}.netbar .lu{width:14px;height:14px}
body.net-on .top{top:30px}body.net-on #view{padding-top:30px}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .box{width:100%;max-width:420px}
.auth .brand{text-align:center;margin-bottom:14px}.auth .brand img{width:96px;height:96px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.auth h1{margin:8px 0 2px;font-size:1.8rem;letter-spacing:.02em}.auth h1 b{color:var(--grn)}
.demo{background:var(--ambbg);color:var(--amb);border-radius:12px;padding:10px 12px;font-size:.82rem;font-weight:600;margin:12px 0}
.foot{text-align:center;color:var(--faint);font-size:.8rem;margin:26px 0 8px}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:.72rem;font-weight:800;color:var(--faint);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--sf);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;gap:2px;font-size:.92rem;overflow:hidden}
.cal button.out{opacity:.4}.cal button.td{border:2px solid var(--pri2)}.cal button.sel{background:var(--btn);color:var(--btntx);border-color:var(--btn)}
.cal button.fer{color:var(--red);background:var(--redbg)}.cal button.sel.fer{background:var(--btn);color:var(--btntx)}
.cal .dots{display:flex;gap:2px;height:5px}.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--pri2)}
.cal .dots i.prova{background:var(--red)}.cal .dots i.trabalho{background:var(--amb)}.cal .dots i.lista{background:var(--blu)}.cal .dots i.atividade{background:var(--grn)}
.cal .hn{display:none;font-size:.58rem;font-weight:700;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.05}
@media (hover:hover) and (pointer:fine){
 .cal{gap:3px}.cal button{aspect-ratio:auto;height:var(--ch,48px);border-radius:10px;font-size:min(1.5rem,calc(var(--ch,48px)*.42));font-weight:800;line-height:1.1}
 .cal .h{font-size:min(1.5rem,calc(var(--ch,48px)*.42));font-weight:800}.calhd h2{font-size:min(1.5rem,calc(var(--ch,48px)*.42))!important}
 .cal[data-sz=xs] .dots,.cal[data-sz=xs] .hn,.cal[data-sz=sm] .hn{display:none}.cal[data-sz=md] .hn,.cal[data-sz=lg] .hn{display:block}
}
.tipo{width:10px;height:10px;border-radius:50%;flex:none;background:var(--pri2)}.tipo.prova{background:var(--red)}.tipo.trabalho{background:var(--amb)}.tipo.lista{background:var(--blu)}.tipo.atividade{background:var(--grn)}
/* árvore de disciplinas */
.treewrap{position:relative;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sf);padding:12px 12px 16px}
.tree{display:flex;gap:34px;position:relative;width:max-content;min-width:100%}
.tcol{width:158px;display:flex;flex-direction:column;gap:10px}
.tcol h4{margin:0 0 4px;font-size:.78rem;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0}
.node{position:relative;z-index:1;text-align:left;border:2px solid var(--line);background:var(--sf);border-radius:12px;padding:8px 9px;font-size:.78rem;font-weight:700;line-height:1.2;min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.node small{font-weight:600;color:var(--faint);font-size:.68rem}
.node.done{background:var(--grnbg);border-color:var(--grn)}.node.done small{color:var(--grn)}
.node.now{background:var(--blubg);border-color:var(--blu)}.node.now small{color:var(--blu)}
.node.lock{opacity:.55;border-style:dashed}.node.opt{border-style:dotted}
.node.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri2) 35%,transparent)}
svg.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.lines path{fill:none;stroke:var(--faint);stroke-width:1.6;opacity:.55}svg.lines path.on{stroke:var(--grn);stroke-width:2.6;opacity:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--soft);margin:8px 2px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--line);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--grnbg);border-color:var(--grn)}.legend i.n{background:var(--blubg);border-color:var(--blu)}.legend i.l{border-style:dashed}
.opt2{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--sf);border-radius:12px;padding:11px 12px;margin:6px 0}
.opt2.ok{border-color:var(--grn);background:var(--grnbg)}.opt2.bad{border-color:var(--red);background:var(--redbg)}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media (min-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.kpi span{display:block;font-size:.72rem;color:var(--soft)}.kpi b{display:block;font-size:1.2rem;margin-top:2px}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}
.ckb{width:28px;height:28px;border-radius:9px;border:2px solid var(--faint);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}.ckb.on{background:var(--grn);border-color:var(--grn)}.ckb .lu{width:16px;height:16px;stroke-width:3}
.done-t{text-decoration:line-through;color:var(--faint)}
.tab-scroll{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.pill-in{display:flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:0 10px}.pill-in input{border:0;background:none;box-shadow:none}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}table.t th{text-align:left;font-size:.72rem;color:var(--faint);text-transform:uppercase;padding:6px}table.t td{padding:8px 6px;border-top:1px solid var(--line)}

@media (min-width:1180px){.tree{width:100%;gap:26px}.tcol{flex:1 1 0;width:auto;min-width:124px}}

</style>
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="main" class="hidden"><div class="app" id="view"></div></div>
<nav class="nav hidden" id="nav" aria-label="Navegação"><div class="in" id="navIn"></div></nav>
<div id="sheet" class="sheet hidden"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="netBar" class="netbar hidden" role="status" aria-live="polite"></div>

/* Grade MODELO. Os nomes seguem o que é comum nesses cursos, mas NÃO substituem o PPC oficial:

function montaGrade(curso,sems){const out=[],ids={};sems.forEach((lista,i)=>lista.forEach(([n])=>{ids[n]=curso+"-"+slug(n);}));

function quizIniciar({disc,tema}){let pool=questoesDe(disc,true).filter(q=>!tema||q.tema===tema).filter(q=>q.status!=="pendente"||isStaff());if(!pool.length)return toast("info","Sem questões para treinar","Escolha outra disciplina ou tema.");
  pool=pool.slice().sort(()=>Math.random()-.5).slice(0,10);const nv={v:"quiz",qz:{disc,tema:tema||"",ids:pool.map(q=>q.id),i:0,ok:0,fim:false,resp:null,ver:false}};if(VIEW.v==="quiz"){VIEW=nv;render();}else go(nv);}
const questaoPorId=id=>D.questoes.find(q=>q.id===id)||QUESTOES_EX.find(q=>q.id===id);
VIEWS.quiz=function(){const z=VIEW.qz;if(!z)return topBar("Treino")+`<p class="empty">Sem treino em andamento.</p>`;const upd=p=>{VIEW=Object.assign({},VIEW,{qz:Object.assign({},z,p)});render();};
  if(z.fim){const pct=Math.round(z.ok/z.ids.length*100);on(()=>{$("qA").onclick=()=>quizIniciar({disc:z.disc,tema:z.tema});$("qB").onclick=back;});
    return topBar("Resultado")+`<div class="hero" style="text-align:center"><h2>${z.ok} de ${z.ids.length}</h2><p>${pct>=80?"Excelente! Você domina esse conteúdo.":pct>=50?"Bom caminho. Revise os pontos que errou.":"Vale revisar a teoria e treinar de novo."}</p></div><div class="btns"><button class="btn full" id="qA">${ic("refresh-cw")} Treinar de novo</button><button class="btn ghost full" id="qB">Voltar</button></div>`;}
  const q=questaoPorId(z.ids[z.i]);if(!q)return topBar("Treino")+`<p class="empty">Questão indisponível.</p>`;const obj=q.tipo==="objetiva"&&lista(q.alts).length,respondeu=z.resp!==null||z.ver;
  const fim=ok=>{registrar(z.disc,q.tema,ok);const nz=z.ok+(ok?1:0);if(z.i+1>=z.ids.length)upd({ok:nz,fim:true});else upd({ok:nz,i:z.i+1,resp:null,ver:false});};
  on(()=>{qa("[data-al]").forEach(b=>b.onclick=()=>{if(z.resp!==null)return;const k=+b.dataset.al,ok=k===+q.gab;registrar(z.disc,q.tema,ok);VIEW=Object.assign({},VIEW,{qz:Object.assign({},z,{resp:k,ok:z.ok+(ok?1:0)})});render();});
    const nx=$("qN");if(nx)nx.onclick=()=>{if(z.i+1>=z.ids.length)upd({fim:true});else upd({i:z.i+1,resp:null,ver:false});};const v=$("qV");if(v)v.onclick=()=>upd({ver:true});const a=$("qOk");if(a)a.onclick=()=>fim(true);const e=$("qNo");if(e)e.onclick=()=>fim(false);});
  return topBar(`Questão ${z.i+1} de ${z.ids.length}`)+`<div class="bar b" style="margin:14px 0"><i style="width:${Math.round(z.i/z.ids.length*100)}%"></i></div>
  <div class="card"><div class="q-meta"><span class="st b">${TIPOS_Q[q.tipo]||""}</span><span class="st">${DIFS[q.dif]||""}</span>${q.tema?`<span class="st">${esc(q.tema)}</span>`:""}${q.prof&&!q.ex?`<span class="st">${esc(q.prof)}</span>`:""}</div><div style="white-space:pre-wrap">${esc(q.enunciado)}</div>
  ${obj?lista(q.alts).map((a,k)=>{const cls=z.resp===null?"":k===+q.gab?"ok":k===z.resp?"bad":"";return `<button class="opt2 ${cls}" data-al="${k}"><b>${"ABCDE"[k]}</b><span class="grow">${esc(a)}</span>${cls==="ok"?ic("circle-check"):cls==="bad"?ic("x"):""}</button>`;}).join(""):""}
  ${obj&&respondeu?`<div class="card" style="margin-top:10px;background:var(--sf2)"><b>${z.resp===+q.gab?"Correto!":"Resposta correta: "+"ABCDE"[+q.gab]}</b>${q.resolucao?`<div class="small muted" style="margin-top:4px;white-space:pre-wrap">${esc(q.resolucao)}</div>`:""}</div>`:""}
  ${!obj&&!respondeu?`<button class="btn full" id="qV" style="margin-top:12px">${ic("eye")} Ver resposta</button>`:""}
  ${!obj&&respondeu?`<div class="card" style="margin-top:10px;background:var(--sf2)"><b>Resposta:</b> ${esc(q.gab||"—")}${q.resolucao?`<div class="small muted" style="margin-top:4px;white-space:pre-wrap">${esc(q.resolucao)}</div>`:""}</div><div class="row" style="gap:8px;margin-top:10px"><button class="btn grn grow" id="qOk">${ic("check")} Acertei</button><button class="btn danger grow" id="qNo">${ic("x")} Errei</button></div>`:""}</div>
  ${obj&&respondeu?`<button class="btn full" id="qN" style="margin-top:12px">${z.i+1>=z.ids.length?"Ver resultado":"Próxima"} ${ic("arrow-right")}</button>`:""}`;};
function questForm(disc,id){const q=id?D.questoes.find(x=>x.id===id):{disc,tema:"",tipo:"objetiva",dif:2,enunciado:"",alts:["","","",""],gab:0,resolucao:"",prof:"",sem:"",fonte:""};if(!q)return;if(!disc)disc=q.disc;let tipo=q.tipo,dif=q.dif;const profs=D.professores.filter(p=>lista(p.disc).includes(disc)).sort(byNome),alts=lista(q.alts).concat(["","","",""]).slice(0,4);
  const draw=()=>{const obj=tipo==="objetiva";$("qFx").innerHTML=obj?`<div class="fld"><span>Alternativas (marque a correta)</span>${alts.map((a,k)=>`<div class="row" style="gap:8px;margin-bottom:6px"><input type="radio" name="gb" data-gb="${k}" ${+q.gab===k?"checked":""} style="width:20px;height:20px;accent-color:var(--grn)"><input data-alt="${k}" maxlength="160" value="${esc(a)}" placeholder="Alternativa ${"ABCD"[k]}"></div>`).join("")}</div>`:`<label class="fld"><span>Resposta (texto ou valor)</span><input id="qG" maxlength="200" value="${esc(typeof q.gab==="string"?q.gab:"")}"></label>`;};
  sheet(`<h2>${id?"Editar questão":isStaff()?"Nova questão":"Sugerir questão"}</h2><p class="small muted" style="margin:0 0 8px">${esc(discNome(disc))}</p>
  <div class="row" style="gap:8px"><label class="fld grow"><span>Tema</span><input id="qT" maxlength="50" value="${esc(q.tema||"")}" placeholder="Ex.: Elasticidade"></label></div>
  <div class="fld"><span>Tipo</span><div class="seg" id="qTp">${Object.entries(TIPOS_Q).map(([k,n])=>`<button data-v="${k}" aria-pressed="${k===tipo}">${n}</button>`).join("")}</div></div>
  <div class="fld"><span>Dificuldade</span><div class="seg" id="qDf">${Object.entries(DIFS).map(([k,n])=>`<button data-v="${k}" aria-pressed="${+k===+dif}">${n}</button>`).join("")}</div></div>
  <label class="fld"><span>Enunciado</span><textarea id="qE" maxlength="1200">${esc(q.enunciado)}</textarea></label><div id="qFx"></div>
  <label class="fld"><span>Resolução comentada</span><textarea id="qR" maxlength="1200" style="min-height:70px">${esc(q.resolucao||"")}</textarea></label>
  <div class="row" style="gap:8px"><label class="fld grow"><span>Professor (estilo da prova)</span><input id="qP" list="qPl" maxlength="60" value="${esc(q.prof||"")}"><datalist id="qPl">${profs.map(p=>`<option value="${esc(p.nome)}">`).join("")}</datalist></label><label class="fld" style="width:96px"><span>Semestre</span><input id="qS" maxlength="8" value="${esc(q.sem||"")}" placeholder="2026.1"></label></div>
  <label class="fld"><span>Origem (prova, lista, livro…)</span><input id="qF" maxlength="80" value="${esc(q.fonte||"")}"></label>
  <p class="tiny muted">${isStaff()?"Questões de staff entram direto no banco.":"Sua sugestão será revisada por um professor ou monitor antes de aparecer."}</p>
  <div class="btns"><button class="btn full" id="qOk2">Salvar</button>${id&&(isStaff()||q.autor===UID)?`<button class="btn danger full" id="qDel">Excluir</button>`:""}</div>`);draw();
  $("qTp").onclick=e=>{const b=e.target.closest("button");if(!b)return;tipo=b.dataset.v;qa("#qTp button").forEach(y=>y.setAttribute("aria-pressed",y===b));syncAlts();draw();};$("qDf").onclick=e=>{const b=e.target.closest("button");if(!b)return;dif=+b.dataset.v;qa("#qDf button").forEach(y=>y.setAttribute("aria-pressed",y===b));};
  const syncAlts=()=>{qa("[data-alt]").forEach(i=>alts[+i.dataset.alt]=i.value);const g=document.querySelector("[data-gb]:checked");if(g)q.gab=+g.dataset.gb;};
  $("qOk2").onclick=async()=>{syncAlts();const enun=$("qE").value.trim();if(enun.length<8)return toast("triangle-alert","Escreva o enunciado","");const obj=tipo==="objetiva";
    if(obj&&alts.filter(a=>a.trim()).length<2)return toast("triangle-alert","Informe ao menos 2 alternativas","");const gab=obj?(+q.gab||0):($("qG")?$("qG").value.trim():"");
    const v={disc,tema:$("qT").value.trim(),tipo,dif:+dif,enunciado:enun,alts:obj?alts.map(a=>a.trim()).filter(Boolean):[],gab,resolucao:$("qR").value.trim(),prof:$("qP").value.trim(),sem:$("qS").value.trim(),fonte:$("qF").value.trim()};
    if(id)await B.update("questoes",id,v);else await B.add("questoes",Object.assign(v,{autor:UID,status:isStaff()?"aprovado":"pendente",criado:Date.now()}));closeSheet();toast("circle-check",isStaff()||id?"Questão salva":"Sugestão enviada","Obrigado por contribuir!");};
  const x=$("qDel");if(x)x.onclick=async()=>{if(!confirm("Excluir esta questão?"))return;await B.del("questoes",id);closeSheet();};}

VIEWS.carreira=function(){const sc=VIEW.sc||"caminhos",A=VIEW.area||"",C=D.contatos.slice().sort(byNome).filter(c=>!A||c.area===A),prog=ME.caminho||{};

    qa("[data-ce]").forEach(b=>b.onclick=()=>contatoForm(b.dataset.ce));const f=$("fab");if(f)f.onclick=()=>contatoForm(null);

  else if(sc==="rede")corpo=`<div class="chips" style="margin:6px 0 10px">${AREAS_CONTATO.map(a=>`<button class="st ${A===a?"b":""}" data-ar="${a}" style="padding:6px 12px">${a}</button>`).join("")}</div>${C.length?C.map(c=>{const w=waLink(c.tel);return `<div class="card" style="margin-bottom:8px"><div class="row"><span class="e" style="color:var(--pri2)">${ic(c.area==="Empresa"?"building-2":"user-round")}</span><div class="grow"><b>${esc(c.nome)}</b><div class="tiny muted">${esc([c.cargo,c.empresa].filter(Boolean).join(" · "))}</div></div><span class="st b">${esc(c.area||"")}</span>${isStaff()?`<button class="ib" data-ce="${c.id}" aria-label="Editar">${ic("pencil")}</button>`:""}</div>${c.obs?`<div class="small muted" style="margin:6px 0">${esc(c.obs)}</div>`:""}<div class="chips" style="margin-top:8px">${w?`<a class="btn ghost sm" href="${w}" target="_blank" rel="noopener">${ic("message-circle")} ${esc(fmtFone(c.tel))}</a>`:c.tel?`<span class="st">${esc(c.tel)}</span>`:""}${c.email?`<a class="btn ghost sm" href="mailto:${esc(c.email)}">${ic("mail")} E-mail</a>`:""}${urlOk(c.url)?`<a class="btn ghost sm" href="${esc(c.url)}" target="_blank" rel="noopener">${ic("external-link")} Perfil</a>`:""}</div></div>`;}).join(""):`<div class="card empty">Nenhum contato${A?" nesta área":""} ainda.${isStaff()?"<br>Toque em + para adicionar.":"<br>Professores e monitores cadastram os contatos."}</div>`}`;
  else corpo=`<div class="card"><b>Meu currículo</b><p class="small muted" style="margin:4px 0 8px">Guarde aqui o link do seu currículo (Drive, site pessoal, LinkedIn) para enviar rápido.</p><label class="fld" style="margin:0"><input id="cvU" inputmode="url" placeholder="https://" value="${esc(ME.curriculo||"")}"></label><div class="row" style="gap:8px;margin-top:8px"><button class="btn grow" id="cvS">Salvar</button>${urlOk(ME.curriculo)?`<a class="btn ghost" href="${esc(ME.curriculo)}" target="_blank" rel="noopener">${ic("external-link")} Abrir</a>`:""}</div></div>
   <div class="lbl">${ic("list-checks")} Antes de enviar</div><div class="card small" style="line-height:1.6">• Uma página, com foto opcional e dados de contato atualizados.<br>• Resultados concretos em vez de só funções.<br>• Formação, monitorias, projetos e idiomas em destaque.<br>• Arquivo em PDF com seu nome (ex.: Nome-Sobrenome.pdf).<br>• Revisão de ortografia por um colega ou monitor.</div>
   <div class="lbl">${ic("briefcase")} Onde enviar</div>${D.contatos.filter(c=>c.area==="Vagas e estágios").map(c=>`<div class="item" style="cursor:default"><span class="e">${ic("briefcase")}</span><div class="grow"><b>${esc(c.nome)}</b><div class="tiny muted">${esc(c.obs||c.empresa||"")}</div></div>${urlOk(c.url)?`<a class="btn ghost sm" href="${esc(c.url)}" target="_blank" rel="noopener">Abrir</a>`:c.email?`<a class="btn ghost sm" href="mailto:${esc(c.email)}">E-mail</a>`:""}</div>`).join("")||`<div class="card empty">Os locais para envio de currículo serão cadastrados na Rede de contatos (área “Vagas e estágios”).</div>`}`;

  if(sc==="moderacao"){qa("[data-ok]").forEach(b=>b.onclick=()=>{const [c,id]=b.dataset.ok.split(":");B.update(c,id,{status:c==="ideias"?"aprovada":"aprovado"});toast("circle-check","Aprovado","");});qa("[data-no]").forEach(b=>b.onclick=()=>{const [c,id]=b.dataset.no.split(":");if(c==="ideias")B.update(c,id,{status:"rejeitada"});else B.del(c,id);toast("info","Rejeitado","");});}
  if(sc==="conteudo"){qa("[data-ge]").forEach(b=>b.onclick=()=>gradeEditor(b.dataset.ge));$("aLk").onclick=linksEditor;$("aTr").onclick=trilhaEditor;qa("[data-go2]").forEach(b=>b.onclick=()=>go({v:b.dataset.go2}));qa("[data-oe]").forEach(b=>b.onclick=()=>evForm(b.dataset.oe));$("aOe").onclick=()=>evForm(null,TODAY());}}
function userForm(id){const u=D.users.find(x=>x.id===id);if(!u)return;sheet(`<h2>${esc(u.nome||"")}</h2><p class="small muted" style="margin:0 0 8px">${esc(u.email||"")}</p>
  <label class="fld"><span>Nível de acesso</span><select id="uP">${Object.entries(PAPEIS).map(([k,n])=>`<option value="${k}" ${(u.papel||"aluno")===k?"selected":""}>${n}</option>`).join("")}</select></label>
  <label class="fld"><span>Nome do professor (para ver as ideias sobre ele)</span><input id="uPn" list="uPl" maxlength="80" value="${esc(u.profNome||"")}"><datalist id="uPl">${D.professores.map(p=>`<option value="${esc(p.nome)}">`).join("")}</datalist></label>
  <p class="tiny muted">Administrador acessa tudo. Professor e monitor podem publicar materiais, aprovar questões e editar o calendário oficial.</p><div class="btns"><button class="btn full" id="uOk">Salvar</button></div>`);
  $("uOk").onclick=async()=>{await B.update("users",id,{papel:$("uP").value,profNome:$("uPn").value.trim()});closeSheet();toast("circle-check","Nível atualizado","Vale na próxima abertura do app da pessoa.");};}
function gradeEditor(curso){const G=gradeDe(curso),pub=gradePublicada(curso);
  sheet(`<h2>Grade de ${CURSOS[curso].nome}</h2>${pub?"":`<div class="demo">Esta é a grade modelo. Ao salvar a primeira alteração ela será copiada para o banco e passará a valer para todos.</div>`}
  <div style="max-height:46vh;overflow:auto">${[...new Set(G.map(d=>d.sem))].sort((a,b)=>a-b).map(s=>`<div class="lbl" style="margin:10px 0 4px">${s}º semestre</div>${G.filter(d=>d.sem===s).map(d=>`<button class="item" data-gd="${d.id}" style="padding:8px 12px;margin-bottom:5px"><div class="grow"><b style="font-size:.9rem">${esc(d.nome)}</b><span class="tiny muted">${d.cr||4} cr${d.opt?" · optativa":""}${lista(d.pre).length?" · pré: "+lista(d.pre).map(discNome).join(", "):""}</span></div>${ic("pencil")}</button>`).join("")}`).join("")}</div>
  <div class="btns"><button class="btn full" id="gNew">${ic("plus")} Nova disciplina</button><button class="btn ghost full" id="gImp">${ic("upload")} Importar grade (JSON)</button><button class="btn ghost full" id="gExp">${ic("download")} Copiar grade (JSON)</button>${pub?"":`<button class="btn grn full" id="gPub">${ic("check-check")} Marcar esta grade como conferida (publicar)</button>`}</div>`);
  qa("[data-gd]").forEach(b=>b.onclick=()=>discForm(b.dataset.gd,curso));$("gNew").onclick=()=>discForm(null,curso);$("gImp").onclick=()=>gradeImport(curso);
  $("gExp").onclick=async()=>{const j=JSON.stringify(G.map(d=>({nome:d.nome,sem:d.sem,cr:d.cr||4,opt:!!d.opt,pre:lista(d.pre).map(discNome)})),null,1);try{await navigator.clipboard.writeText(j);toast("circle-check","Grade copiada","Cole em um arquivo para guardar.");}catch(e){prompt("Copie:",j);}};
  const p=$("gPub");if(p)p.onclick=async()=>{await publicarGrade(curso);closeSheet();toast("circle-check","Grade publicada","");};}
function discForm(id,curso){const d=id?discById(id):{nome:"",sem:1,cr:4,opt:false,pre:[],ementa:""};if(!d)return;const G=gradeDe(curso),pre=new Set(lista(d.pre));
  sheet(`<h2>${id?"Editar disciplina":"Nova disciplina"}</h2><label class="fld"><span>Nome</span><input id="dN" maxlength="80" value="${esc(d.nome)}"></label>
  <div class="row" style="gap:8px"><label class="fld grow"><span>Semestre</span><select id="dS">${[1,2,3,4,5,6,7,8].map(n=>`<option ${+d.sem===n?"selected":""}>${n}</option>`).join("")}</select></label><label class="fld grow"><span>Créditos</span><input id="dC" type="number" min="1" max="12" value="${d.cr||4}"></label></div>
  <label class="row" style="gap:8px;margin:6px 0"><input type="checkbox" id="dO" ${d.opt?"checked":""}><span class="small">Optativa</span></label>
  <div class="fld"><span>Pré-requisitos</span><div style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px">${G.filter(x=>x.id!==id).map(x=>`<label class="row small" style="padding:4px 0;gap:8px"><input type="checkbox" data-pr="${x.id}" ${pre.has(x.id)?"checked":""}><span class="grow">${esc(x.nome)}</span><span class="tiny faint">${x.sem}º</span></label>`).join("")}</div></div>
  <label class="fld"><span>Ementa (opcional)</span><textarea id="dE" maxlength="1200" style="min-height:70px">${esc(d.ementa||"")}</textarea></label>
  <div class="btns"><button class="btn full" id="dOk">Salvar</button>${id?`<button class="btn danger full" id="dDel">Excluir</button>`:""}</div>`);
  $("dOk").onclick=async()=>{const nome=$("dN").value.trim();if(!nome)return toast("triangle-alert","Informe o nome","");if(!gradePublicada(curso))await publicarGrade(curso);const nid_=id||curso+"-"+slug(nome)+(G.some(x=>x.id===curso+"-"+slug(nome))?"-"+nid().slice(-3):""),v={curso,nome,sem:+$("dS").value,cr:+$("dC").value||4,opt:$("dO").checked,pre:qa("[data-pr]:checked").map(x=>x.dataset.pr),ementa:$("dE").value.trim()};await B.set("disciplinas",nid_,v);closeSheet();toast("circle-check","Disciplina salva","");};
  const x=$("dDel");if(x)x.onclick=async()=>{if(!confirm("Excluir esta disciplina? Ela some também dos pré-requisitos."))return;if(!gradePublicada(curso))await publicarGrade(curso);for(const o of gradeDe(curso).filter(o=>lista(o.pre).includes(id)))await B.update("disciplinas",o.id,{pre:lista(o.pre).filter(p=>p!==id)});await B.del("disciplinas",id);closeSheet();};}
function gradeImport(curso){sheet(`<h2>Importar grade de ${CURSOS[curso].nome}</h2><p class="small muted">Cole uma lista em JSON: <code>[{"nome":"Cálculo I","sem":1,"cr":4,"opt":false,"pre":[]}]</code>. Em <b>pre</b>, use os nomes das disciplinas. A grade atual será substituída.</p><label class="fld"><textarea id="gJ" style="min-height:170px;font-family:monospace;font-size:.8rem"></textarea></label><div class="btns"><button class="btn full" id="gJo">Importar</button></div>`);
  $("gJo").onclick=async()=>{let arr;try{arr=JSON.parse($("gJ").value);if(!Array.isArray(arr)||!arr.length)throw 0;}catch(e){return toast("triangle-alert","JSON inválido","Confira o formato do exemplo.");}
    const ids={};arr.forEach(x=>ids[x.nome]=curso+"-"+slug(x.nome));if(!confirm(`Substituir a grade atual por ${arr.length} disciplinas?`))return;for(const d of D.disciplinas.filter(d=>d.curso===curso))await B.del("disciplinas",d.id);
    for(const x of arr)await B.set("disciplinas",ids[x.nome],{curso,nome:x.nome,sem:+x.sem||1,cr:+x.cr||4,opt:!!x.opt,pre:lista(x.pre).map(p=>ids[p]).filter(Boolean),ementa:x.ementa||""});closeSheet();toast("circle-check","Grade importada",arr.length+" disciplinas");};}
function linksEditor(){const L=linksL().map(x=>Object.assign({},x));const draw=()=>{sheet(`<h2>Links úteis</h2><p class="small muted">O link marcado como destaque aparece no Início (use para o RU).</p>${L.map((l,i)=>`<div class="card" style="margin-bottom:8px"><label class="fld" style="margin-top:0"><span>Título</span><input data-lt="${i}" value="${esc(l.t)}" maxlength="60"></label><label class="fld"><span>Descrição</span><input data-ld="${i}" value="${esc(l.d||"")}" maxlength="90"></label><label class="fld"><span>Endereço (https://…)</span><input data-lu="${i}" value="${esc(l.url||"")}" inputmode="url" maxlength="300"></label><div class="row"><label class="row small grow" style="gap:6px"><input type="checkbox" data-lh="${i}" ${l.dest?"checked":""}> Destaque no Início</label><button class="btn sm danger" data-lx="${i}">${ic("trash-2")}</button></div></div>`).join("")}<div class="btns"><button class="btn ghost full" id="lAdd">${ic("plus")} Adicionar link</button><button class="btn full" id="lOk">Salvar</button></div>`);
    const read=()=>{qa("[data-lt]").forEach(i=>L[+i.dataset.lt].t=i.value);qa("[data-ld]").forEach(i=>L[+i.dataset.ld].d=i.value);qa("[data-lu]").forEach(i=>L[+i.dataset.lu].url=normUrl(i.value));qa("[data-lh]").forEach(i=>L[+i.dataset.lh].dest=i.checked);};
    qa("[data-lx]").forEach(b=>b.onclick=()=>{read();L.splice(+b.dataset.lx,1);draw();});$("lAdd").onclick=()=>{read();L.push({id:nid(),t:"Novo link",d:"",url:"",ic:"link"});draw();};$("lOk").onclick=async()=>{read();await B.set("config","links",{lista:L.filter(l=>l.t.trim())});closeSheet();toast("circle-check","Links salvos","");};};draw();}
function trilhaEditor(){const T=trilhaL().map(x=>Object.assign({},x));const draw=()=>{sheet(`<h2>Trilha de primeiros passos</h2>${T.map((p,i)=>`<div class="card" style="margin-bottom:8px"><label class="fld" style="margin-top:0"><span>Passo ${i+1}</span><input data-tt="${i}" value="${esc(p.t)}" maxlength="90"></label><label class="fld"><span>Orientação</span><textarea data-td="${i}" maxlength="400" style="min-height:56px">${esc(p.d||"")}</textarea></label><div class="row"><button class="btn sm ghost" data-tu="${i}" ${i?"":"disabled"}>${ic("chevron-left","")} Subir</button><span class="grow"></span><button class="btn sm danger" data-tx="${i}">${ic("trash-2")}</button></div></div>`).join("")}<div class="btns"><button class="btn ghost full" id="tAdd">${ic("plus")} Adicionar passo</button><button class="btn full" id="tOk">Salvar</button></div>`);
    const read=()=>{qa("[data-tt]").forEach(i=>T[+i.dataset.tt].t=i.value);qa("[data-td]").forEach(i=>T[+i.dataset.td].d=i.value);};qa("[data-tx]").forEach(b=>b.onclick=()=>{read();T.splice(+b.dataset.tx,1);draw();});qa("[data-tu]").forEach(b=>b.onclick=()=>{read();const i=+b.dataset.tu;[T[i-1],T[i]]=[T[i],T[i-1]];draw();});
    $("tAdd").onclick=()=>{read();T.push({id:nid(),ic:"check",t:"Novo passo",d:""});draw();};$("tOk").onclick=async()=>{read();await B.set("config","trilha",{passos:T.filter(p=>p.t.trim())});closeSheet();toast("circle-check","Trilha salva","");};};draw();}

/* ================= LOGIN E CADASTRO ================= */
const ERRS={"auth/email-already-in-use":"Este e-mail já tem conta. Toque em Entrar.","auth/invalid-credential":"E-mail ou senha incorretos.","auth/wrong-password":"E-mail ou senha incorretos.","auth/user-not-found":"E-mail ou senha incorretos.","auth/weak-password":"A senha precisa ter ao menos 6 caracteres.","auth/invalid-email":"E-mail inválido.","auth/too-many-requests":"Muitas tentativas. Aguarde um pouco.","auth/network-request-failed":"Sem internet no momento.","demo":"No modo demonstração não há recuperação de senha."};
let AUTH_EMAIL="";
function mostraApp(){$("auth").classList.add("hidden");$("main").classList.remove("hidden");$("nav").classList.remove("hidden");}
function authScreen(mode){mode=mode||"in";$("main").classList.add("hidden");$("nav").classList.add("hidden");closeSheet();const a=$("auth");a.classList.remove("hidden");
  const up=mode==="up",dom=(CFG.dominiosPermitidos||[]).filter(Boolean);
  a.innerHTML=`<div class="box"><div class="brand"><img src="ecofin-logo.png" alt="ECOFIN"><h1>ECO<b>FIN</b></h1><p class="muted small" style="margin:0">Seu caminho em Economia e Finanças, do 1º ao 8º semestre</p></div>
  ${DEMO?`<div class="demo">Modo demonstração: os dados ficam só neste aparelho. Para usar com a turma toda, configure o Firebase (veja o LEIA-ME).</div>`:""}
  <div class="card"><div class="seg" style="margin-bottom:6px"><button id="aIn" aria-pressed="${!up}">Entrar</button><button id="aUp" aria-pressed="${up}">Criar conta</button></div>
   ${up?`<label class="fld"><span>Nome completo</span><input id="rN" maxlength="80" autocomplete="name"></label><div class="row" style="gap:8px"><label class="fld grow"><span>Curso</span><select id="rC"><option value="">Escolher depois</option>${Object.entries(CURSOS).map(([k,c])=>`<option value="${k}">${c.nome}</option>`).join("")}</select></label><label class="fld" style="width:110px"><span>Semestre</span><select id="rS">${[1,2,3,4,5,6,7,8].map(n=>`<option>${n}</option>`).join("")}</select></label></div>`:""}
   <label class="fld"><span>E-mail${up&&dom.length&&!DEMO?" institucional":""}</span><input id="aE" type="email" inputmode="email" autocomplete="email" placeholder="${dom.length&&!DEMO?"voce@"+dom[0]:"voce@email.com"}"></label>
   <label class="fld"><span>Senha</span><input id="aP" type="password" autocomplete="${up?"new-password":"current-password"}" placeholder="${up?"mínimo 6 caracteres":""}"></label>
   <div id="aErr" class="small" style="color:var(--red);min-height:1.2em;margin:4px 0"></div><button class="btn full" id="aGo">${up?"Criar minha conta":"Entrar"}</button>${up?"":`<div style="text-align:center;margin-top:8px"><button class="link" id="aRs">Esqueci minha senha</button></div>`}</div>
  <p class="foot"><a href="privacidade.html" target="_blank">Política de privacidade</a></p></div>`;
  $("aIn").onclick=()=>authScreen("in");$("aUp").onclick=()=>authScreen("up");const err=m=>{$("aErr").textContent=m;};
  const go_=async()=>{const e=$("aE").value.trim(),p=$("aP").value;err("");if(!e||!p)return err("Preencha e-mail e senha.");const btn=$("aGo");btn.disabled=true;
    try{if(up){const nome=$("rN").value.trim();if(nome.length<3){btn.disabled=false;return err("Informe seu nome completo.");}if(p.length<6){btn.disabled=false;return err(ERRS["auth/weak-password"]);}
        if(dom.length&&!DEMO&&!dom.some(d=>e.toLowerCase().endsWith("@"+d.toLowerCase())||e.toLowerCase().endsWith("."+d.toLowerCase()))){btn.disabled=false;return err("Use seu e-mail institucional ("+dom.map(d=>"@"+d).join(" ou ")+").");}
        SIGNING=true;const uid=await B.signUp(e,p),first=DEMO&&B.nUsers&&B.nUsers()===1;
        const perfil={uid,nome,email:e.toLowerCase(),papel:first?"admin":"aluno",curso:$("rC").value,sem:+$("rS").value,concluidas:[],cursando:[],trilha:{},desempenho:{},caminho:{},curriculo:"",criado:Date.now(),visto:Date.now()};
        await B.set("users",uid,perfil);SIGNING=false;AUTH_EMAIL=e;await afterLogin(uid);}
      else{AUTH_EMAIL=e;await B.signIn(e,p);}}
    catch(x){SIGNING=false;btn.disabled=false;err(ERRS[x&&x.code]||"Não foi possível entrar. Tente de novo.");}};
  $("aGo").onclick=go_;a.onkeydown=ev=>{if(ev.key==="Enter")go_();};
  const rs=$("aRs");if(rs)rs.onclick=async()=>{const e=$("aE").value.trim();if(!e)return err("Digite seu e-mail e toque de novo.");try{await B.reset(e);err("");toast("mail","Enviamos um link para redefinir a senha","Confira seu e-mail.");}catch(x){err(ERRS[x&&x.code]||"Não foi possível enviar.");}};}
async function afterLogin(uid){UID=uid;let p=null;try{p=await B.get("users",uid);}catch(e){console.warn(e);}
  if(!p){const em=AUTH_EMAIL||"";p={uid,nome:(em.split("@")[0]||"Aluno"),email:em.toLowerCase(),papel:"aluno",curso:"",sem:1,concluidas:[],cursando:[],trilha:{},desempenho:{},caminho:{},curriculo:"",criado:Date.now(),visto:Date.now()};try{await B.set("users",uid,p);}catch(e){}}
  ME=Object.assign({id:uid},p);if(!ME.email&&AUTH_EMAIL)ME.email=AUTH_EMAIL;mostraApp();startApp();}
function startApp(){if(STARTED){render();return;}STARTED=true;
  const adm=isAdmin(),staff=isStaff(),prof=papel()==="professor",plan={users:adm?null:[["uid","==",UID]],eventos:[["escopo","==","oficial"],["uid","==",UID]],materiais:staff?null:[["status","==","aprovado"],["autor","==",UID]],questoes:staff?null:[["status","==","aprovado"],["autor","==",UID]],
    ideias:adm?null:prof?[["status","==","aprovada"],["autor","==",UID]]:[["autor","==",UID]],pesquisas:adm?null:[["uid","==",UID]]};
  COLS.forEach(c=>B.listen(c,(arr,meta)=>{D[c]=arr;if(c==="users"){const m=arr.find(u=>u.id===UID);if(m){const em=ME&&ME.email;ME=Object.assign({},m);if(!ME.email&&em)ME.email=em;}}if(c==="eventos")checarLembretes();rr();},plan[c]||null));
  B.update("users",UID,{visto:Date.now()});guard();render();checarLembretes();setInterval(checarLembretes,30*60*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&UID){checarLembretes();B.update("users",UID,{visto:Date.now()});}});}
/* ================= INÍCIO ================= */
function carregaScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("Falha ao carregar "+src));document.head.appendChild(s);});}
async function iniciar(){applyTheme();
  try{if(!DEMO){const v="10.12.2",b=`https://www.gstatic.com/firebasejs/${v}/`;await carregaScript(b+"firebase-app-compat.js");await carregaScript(b+"firebase-auth-compat.js");await carregaScript(b+"firebase-firestore-compat.js");B=FireBackend();}else B=LocalBackend();}
  catch(e){console.error(e);$("auth").classList.remove("hidden");$("auth").innerHTML=`<div class="box card"><b>Não foi possível carregar o ECOFIN.</b><p class="small muted">Verifique sua conexão com a internet e tente de novo.</p><button class="btn full" onclick="location.reload()">Tentar de novo</button></div>`;return;}
  B.onAuth(u=>{if(SIGNING)return;if(!u){UID=null;ME=null;STARTED=false;authScreen("in");return;}if(u.email)AUTH_EMAIL=u.email;afterLogin(u.uid);});
  setTimeout(netUI,800);}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
iniciar();

</script>
